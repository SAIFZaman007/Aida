<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.I.D.A — Artificial Intelligence Desktop Assistant</title>
    <meta name="description" content="A.I.D.A — a voice-first AI assistant with a talking avatar. Speaks and understands Bengali and English." />
    <meta name="theme-color" content="#0b0907" />
    <meta name="color-scheme" content="dark" />
    <!-- Theme: applied before the first paint (no flash). Dark is the default; the choice is kept in localStorage. -->
    <script>
      (function () {
        var t = "dark";
        try { if (localStorage.getItem("aida-theme") === "light") t = "light"; } catch (e) {}
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "light" ? "#f7f1e9" : "#0b0907");
        var c = document.querySelector('meta[name="color-scheme"]'); if (c) c.setAttribute("content", t);
      })();
    </script>
    <style>
      html { background: #0b0907; }
      html[data-theme="light"] { background: #f7f1e9; }
    </style>

    <!-- Brand: favicon set, home-screen icons, install manifest -->
    <link rel="icon" href="/favicon.ico?v=35" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=35" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=35" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=35" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A.I.D.A — Artificial Intelligence Desktop Assistant" />
    <meta property="og:description" content="A voice-first AI assistant with a talking avatar — Bengali and English." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (interface) + Noto Sans Bengali (Inter has no Bengali glyphs). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
