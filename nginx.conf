server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Safe baseline headers (the microphone needs a secure origin; TLS is terminated by the proxy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The app lives at /app (the landing page at /). The page's assets are relative, so a
    # trailing slash would break them: send /app/ to /app.
    location = /app/ {
        return 301 /app;
    }

    # SPA routing — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must always be re-checked so a new deploy is picked up immediately…
    location = /index.html {
        expires -1;
    }

    # …while the hashed build output never changes under the same name.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Avatars and brand images keep their file names: cache a day, then revalidate
    # (nginx serves ETag/Last-Modified and byte ranges for these automatically).
    location ~* \.(glb|webp|png|jpg|jpeg|ico|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Fonts (public/fonts): a missing file must be a clean 404, never index.html, so the browser
    # falls through to the next font in the stack.
    location ~* \.(woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Avatar videos: cacheable for a day (nginx serves byte ranges by itself, so playback starts at once).
    location ~* \.(mp4|webm)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Health check endpoint — Coolify / load balancers use this
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression for faster loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/manifest+json;
    gzip_min_length 1000;
}
